<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="1140" version="1.1" viewBox="0 0 1700 1140" width="1700" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrowBlue" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="11" orient="auto" refX="10" refY="5"><path d="M0,0 L10,5 L0,10 Z" fill="#147AC6" /></marker><marker id="arrowGreen" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="11" orient="auto" refX="10" refY="5"><path d="M0,0 L10,5 L0,10 Z" fill="#168742" /></marker><marker id="arrowPurple" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="11" orient="auto" refX="10" refY="5"><path d="M0,0 L10,5 L0,10 Z" fill="#7152C7" /></marker><marker id="arrowGray" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="11" orient="auto" refX="10" refY="5"><path d="M0,0 L10,5 L0,10 Z" fill="#7E8CA1" /></marker></defs><rect fill="#FBFCFE" height="1140" rx="0" ry="0" stroke="none" stroke-width="0" width="1700" x="0" y="0" /><rect fill="#15213c" height="12" rx="0" ry="0" stroke="none" stroke-width="0" width="1700" x="0" y="0" /><text fill="#15213c" font-family="DejaVu Sans, sans-serif" font-size="48" font-weight="700" x="48" y="83">Как работает Smart DNS</text><text fill="#526178" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" x="48" y="123">Частный DNS на зарубежном VPS: обычные сайты — напрямую, выбранные — через VPS.</text><rect fill="#EDF4FF" height="568" rx="26" ry="26" stroke="#A7BEDF" stroke-width="2.3" width="721" x="468" y="229" /><rect fill="#FFFFFF" height="435" rx="24" ry="24" stroke="#B7C6D9" stroke-width="2" width="318" x="40" y="317" /><rect fill="#EAF8EE" height="188" rx="23" ry="23" stroke="#93CBA7" stroke-width="2" width="366" x="1288" y="267" /><rect fill="#F2EDFF" height="204" rx="23" ry="23" stroke="#B4A1E2" stroke-width="2" width="366" x="1288" y="583" /><path d="M 200 317 L 200 177 Q 200 162 215 162 L 1450 162 Q 1465 162 1465 179 L 1465 265" fill="none" marker-end="url(#arrowGreen)" stroke="#168742" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" /><line fill="none" marker-end="url(#arrowBlue)" stroke="#147AC6" stroke-dasharray="10 8" stroke-linecap="round" stroke-width="4.7" x1="359" x2="505" y1="385" y2="385" /><line fill="none" marker-end="url(#arrowBlue)" stroke="#147AC6" stroke-dasharray="10 8" stroke-linecap="round" stroke-width="4.7" x1="505" x2="359" y1="459" y2="459" /><line fill="none" marker-end="url(#arrowPurple)" stroke="#7152C7" stroke-linecap="round" stroke-width="5.2" x1="359" x2="504" y1="679" y2="679" /><line fill="none" marker-end="url(#arrowPurple)" stroke="#7152C7" stroke-linecap="round" stroke-width="5.2" x1="1148" x2="1276" y1="679" y2="679" /><rect fill="#FFFFFF" height="184" rx="20" ry="20" stroke="#B4CDEC" stroke-width="1.8" width="316" x="506" y="314" /><rect fill="#FFFFFF" height="184" rx="20" ry="20" stroke="#B4CDEC" stroke-width="1.8" width="303" x="843" y="314" /><rect fill="#FFFFFF" height="190" rx="20" ry="20" stroke="#B4CDEC" stroke-width="1.8" width="640" x="506" y="565" /><line fill="none" marker-end="url(#arrowGray)" stroke="#7E8CA1" stroke-dasharray="4 7" stroke-linecap="round" stroke-width="2.8" x1="842" x2="826" y1="403" y2="403" /><path d="M 996 499 L 996 555" fill="none" marker-end="url(#arrowGray)" stroke="#7E8CA1" stroke-dasharray="4 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.8" /><rect fill="#ECFAF0" height="55" rx="18" ry="18" stroke="#B6DFC2" stroke-width="1.5" width="498" x="605" y="135" /><text fill="#168742" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" x="628" y="172">3А   Домен вне реестра → HTTPS напрямую</text><rect fill="#EDF4FF" height="140" rx="13" ry="13" stroke="#4261A9" stroke-width="4" width="87" x="117" y="382" /><rect fill="#FFFFFF" height="95" rx="6" ry="6" stroke="#A4BFE5" stroke-width="1" width="69" x="126" y="403" /><rect fill="#F5F8FF" height="83" rx="9" ry="9" stroke="#4261A9" stroke-width="4" width="105" x="190" y="420" /><path d="M 180 509 L 305 509 L 315 524 L 172 524 Z" fill="#D9E6FA" stroke="#4261A9" stroke-width="3" /><text fill="#15213c" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" text-anchor="middle" x="200" y="564">Ваше устройство</text><text fill="#526178" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" x="76" y="602">Телефон, планшет,</text><text fill="#526178" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" x="76" y="631">компьютер или роутер</text><text fill="#526178" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" x="76" y="660">с частным DNS</text><rect fill="#E9F4FF" height="35" rx="17.5" ry="17.5" stroke="none" stroke-width="0" width="124" x="372" y="338" /><text fill="#147AC6" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="middle" x="434.0" y="361.45">1  DNS →</text><rect fill="#E9F4FF" height="35" rx="17.5" ry="17.5" stroke="none" stroke-width="0" width="124" x="372" y="412" /><text fill="#147AC6" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="middle" x="434.0" y="435.45">2  ← ответ</text><text fill="#15213c" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" x="513" y="281">Зарубежный VPS</text><text fill="#526178" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" x="821" y="281">— ваш частный Smart DNS</text><text fill="#15213c" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" x="532" y="351">AdGuard Home</text><text fill="#526178" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" x="532" y="389">Сверяет домен с реестром</text><text fill="#526178" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" x="532" y="416">Возвращает IP-адрес:</text><rect fill="#EAF8EE" height="30" rx="15.0" ry="15.0" stroke="none" stroke-width="0" width="126" x="530" y="439" /><text fill="#168742" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" text-anchor="middle" x="593.0" y="459.1">IP сайта</text><rect fill="#F2EDFF" height="30" rx="15.0" ry="15.0" stroke="none" stroke-width="0" width="127" x="668" y="439" /><text fill="#7152C7" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" text-anchor="middle" x="731.5" y="459.1">IP VPS</text><text fill="#15213c" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" x="862" y="351">Реестр сервисов</text><text fill="#526178" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" x="862" y="389">Домены и исключения</text><text fill="#526178" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" x="862" y="420">Включение / отключение</text><text fill="#526178" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" x="862" y="451">Обновления реестра</text><text fill="#15213c" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" x="529" y="606">Traefik + HAProxy</text><text fill="#526178" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" x="529" y="644">Проксирование HTTPS/TCP (только выбранные сайты)</text><text fill="#526178" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" x="529" y="711">Передаёт TLS-трафик в обе стороны, не расшифровывая</text><text fill="#526178" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" x="529" y="740">содержимое сайта.</text><rect fill="#F2EDFF" height="38" rx="19.0" ry="19.0" stroke="none" stroke-width="0" width="118" x="373" y="625" /><text fill="#7152C7" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" text-anchor="middle" x="432.0" y="650.46">3Б через VPS</text><circle cx="1350" cy="331" fill="none" r="31" stroke="#168742" stroke-width="3" /><ellipse cx="1350" cy="331" fill="none" rx="14" ry="31" stroke="#168742" stroke-width="2" /><line fill="none" stroke="#168742" stroke-linecap="round" stroke-width="2" x1="1320" x2="1380" y1="331" y2="331" /><text fill="#15213c" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" x="1400" y="321">Обычный сайт</text><text fill="#526178" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" x="1400" y="351">HTTPS прямо с устройства</text><text fill="#526178" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" x="1400" y="378">VPS не участвует</text><circle cx="1350" cy="650" fill="none" r="30" stroke="#7152C7" stroke-width="3" /><ellipse cx="1350" cy="650" fill="none" rx="13" ry="30" stroke="#7152C7" stroke-width="2" /><line fill="none" stroke="#7152C7" stroke-linecap="round" stroke-width="2" x1="1323" x2="1377" y1="650" y2="650" /><text fill="#15213c" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" x="1401" y="629">Геоограниченный</text><text fill="#15213c" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" x="1401" y="660">сервис</text><text fill="#526178" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" x="1401" y="704">Видит IP зарубежного VPS</text><text fill="#526178" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" x="1401" y="731">Например, chatgpt.com</text><line fill="none" marker-end="url(#arrowBlue)" stroke="#147AC6" stroke-dasharray="8 6" stroke-linecap="round" stroke-width="4" x1="58" x2="115" y1="811" y2="811" /><text fill="#526178" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" x="126" y="818">DNS: запрос и ответ</text><line fill="none" marker-end="url(#arrowGreen)" stroke="#168742" stroke-linecap="round" stroke-width="4" x1="400" x2="456" y1="811" y2="811" /><text fill="#526178" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" x="467" y="818">HTTPS напрямую</text><line fill="none" marker-end="url(#arrowPurple)" stroke="#7152C7" stroke-linecap="round" stroke-width="4" x1="737" x2="793" y1="811" y2="811" /><text fill="#526178" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" x="804" y="818">HTTPS через VPS</text><line fill="none" marker-end="url(#arrowGray)" stroke="#7E8CA1" stroke-dasharray="4 6" stroke-linecap="round" stroke-width="3" x1="1103" x2="1159" y1="811" y2="811" /><text fill="#526178" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" x="1170" y="818">Правила, не трафик</text><rect fill="#E9F4FF" height="199" rx="23" ry="23" stroke="none" stroke-width="0" width="515" x="40" y="861" /><rect fill="#EAF8EE" height="199" rx="23" ry="23" stroke="none" stroke-width="0" width="515" x="592" y="861" /><rect fill="#F2EDFF" height="199" rx="23" ry="23" stroke="none" stroke-width="0" width="515" x="1144" y="861" /><rect fill="#D5EAFC" height="42" rx="21.0" ry="21.0" stroke="none" stroke-width="0" width="63" x="62" y="881" /><text fill="#147AC6" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" text-anchor="middle" x="93.5" y="909.14">1–2</text><text fill="#15213c" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" x="137" y="912">Сначала DNS</text><text fill="#15213c" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" x="67" y="954">Устройство спрашивает IP домена. DNS отвечает:</text><text fill="#15213c" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" x="67" y="983">IP сайта или IP VPS. Сам HTTPS-трафик</text><text fill="#15213c" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" x="67" y="1012">в DNS никогда не передаётся.</text><rect fill="#D0EDD9" height="42" rx="21.0" ry="21.0" stroke="none" stroke-width="0" width="58" x="616" y="881" /><text fill="#168742" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" text-anchor="middle" x="645.0" y="909.14">3А</text><text fill="#15213c" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" x="689" y="912">Если домена нет в реестре</text><text fill="#15213c" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" x="617" y="954">Устройство подключается к сайту напрямую.</text><text fill="#15213c" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" x="617" y="983">VPS больше не участвует в соединении.</text><rect fill="#E1D8FB" height="42" rx="21.0" ry="21.0" stroke="none" stroke-width="0" width="58" x="1167" y="881" /><text fill="#7152C7" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" text-anchor="middle" x="1196.0" y="909.14">3Б</text><text fill="#15213c" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" x="1238" y="912">Если домен есть в реестре</text><text fill="#15213c" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" x="1169" y="954">Устройство подключается к VPS, а прокси</text><text fill="#15213c" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" x="1169" y="983">пересылает шифрованный трафик к сайту</text><text fill="#15213c" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" x="1169" y="1012">и обратно. Сайт видит IP VPS.</text><rect fill="#F0F3F8" height="44" rx="12" ry="12" stroke="none" stroke-width="0" width="1615" x="40" y="1080" /><text fill="#526178" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" x="59" y="1109">Почему это не VPN: через VPS идут только выбранные домены, а не весь интернет. Локальные блокировки могут сохраняться.</text></svg>