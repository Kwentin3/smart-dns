name: Community source proposals

# Schedules run only after this workflow reaches the default branch.
# This workflow uploads evidence; it never writes a branch, opens a PR or deploys.
on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

jobs:
  proposal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Fetch selected public service-list differences
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/source_proposals.py
      - name: Upload proposal evidence and MIT attribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: community-source-proposal
          path: .local/source-proposals/latest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
