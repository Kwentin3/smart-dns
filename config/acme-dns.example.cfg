# Source-only candidate: replace the documentation IP and example names before use.
# Fields checked against acme-dns/acme-dns config.cfg at
# v2.0.2, commit 4e5a69e5fb742dde4f755b7f56aee2aea76e19bf.
# This serves only the delegated ACME namespace, not clients' recursive DNS.
[general]
listen = "192.0.2.53:53"
protocol = "both"
domain = "acme-auth.example.net"
nsname = "ns-acme.example.net"
nsadmin = "hostmaster.example.net"
records = [
    "ns-acme.example.net. A 192.0.2.53",
    "acme-auth.example.net. NS ns-acme.example.net.",
]
debug = false

[database]
engine = "sqlite"
connection = "/var/lib/smart-dns-acme/acme-dns.db"

[api]
ip = "127.0.0.1"
port = "15380"
tls = "none"
# Registration is a bounded bootstrap step: enable temporarily, register the
# one required account locally, save its credentials privately, disable again,
# and restart only smart-dns-acme. Normal renewals use /update, not /register.
disable_registration = true
corsorigins = []
use_header = false

[logconfig]
loglevel = "error"
logtype = "stdout"
logformat = "json"
